<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BOTC Grimoire Hub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg class="drop" viewBox="0 0 24 24">
        <path d="M12 2S4.5 8.5 4.5 13S8 21 12 21s7.5-3.5 7.5-8S12 2 12 2zm0 16c-2.8 0-5-2.2-5-5c0-1.8 1.2-3.8 2.6-5.1c.9-.8 1.9-1.4 2.4-1.8c.5.4 1.5 1 2.4 1.8c1.4 1.3 2.6 3.3 2.6 5.1c0 2.8-2.2 5-5 5z"/>
      </svg>
      <h1>Grimoire Hub</h1>
    </div>
  </div>
  
  <div class="settings-panel">
    <div class="setting-row">
      <span class="setting-label">Auto-detect theme from game</span>
      <label class="switch">
        <input type="checkbox" id="auto-detect-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="search-box" placeholder="Search scripts & themes...">
  </div>

  <div id="themes-list" class="themes-list">
    <div class="loading">Loading registry...</div>
  </div>

  <div class="footer">
    <span>v1.0.0</span>
    <a href="https://github.com/aerojamie/botc-custom-themes" target="_blank">GitHub Repository</a>
  </div>
  
  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
