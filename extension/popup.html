<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BOTC Grimoire Pick</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <img class="logo-img" src="icon.png" alt="Grimoire Pick Logo" width="28" height="28" style="width: 28px; height: 28px; object-fit: contain;">
      <h1>Grimoire Pick</h1>
    </div>
  </div>
  
  <div class="settings-panel">
    <div class="setting-row">
      <span class="setting-label">Auto-detect theme from game</span>
      <label class="switch">
        <input type="checkbox" id="auto-detect-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="search-box" placeholder="Search scripts & themes...">
  </div>

  <div id="themes-list" class="themes-list">
    <div class="loading">Loading registry...</div>
  </div>

  <div class="footer">
    <span>v1.0.4</span>
    <a href="https://github.com/cijamie/grimoirepick" target="_blank">GitHub Repository</a>
  </div>
  
  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
